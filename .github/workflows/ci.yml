name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache Bun's global module cache AND the resolved node_modules tree,
      # keyed by the lockfile so a dependency change invalidates both. Restore
      # keys only ever reuse a previous tree as a warm start; the frozen install
      # below still reconciles it, so results stay byte-for-byte consistent.
      - name: Cache Bun + node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Playwright's browser download is the slowest step; cache it per version.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Lint and typecheck
        run: |
          bun run lint
          bunx tsc --noEmit

      - name: Unit tests
        run: bunx vitest run

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Step-level timeout stays below the job timeout so a hung pointer
      # interaction fails this step instead of killing the job, guaranteeing the
      # upload step below still runs and publishes the trace + screenshot.
      - name: E2E tests
        timeout-minutes: 12
        run: bunx playwright test --trace=retain-on-failure

      # Traces, screenshots and videos are produced on failure (see
      # playwright.config.ts) and uploaded unconditionally so evidence for a
      # failing run is always available in the workflow summary.
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            e2e/__screenshots__/
          if-no-files-found: ignore
          retention-days: 14

  # Dedicated gate: focus-trap / Escape-scope regressions in BillingCalendar and
  # DueDatePicker fail the PR on their own, before the slower full suite result
  # is available, and with no retries so a "flaky pass" cannot hide a regression.
  billing-a11y:
    name: Billing a11y (focus trap + Escape)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun + node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: BillingCalendar + DueDatePicker a11y specs
        timeout-minutes: 10
        run: bun run e2e:a11y -- --retries=0 --trace=retain-on-failure
      - name: Upload a11y artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billing-a11y-artifacts-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # Visual regression for BillingCalendar / BillingSheet against the committed
  # baselines in e2e/__screenshots__ with the documented thresholds
  # (threshold 0.1, maxDiffPixelRatio 0.005 - see playwright.config.ts).
  #
  # APPROVING AN INTENTIONAL UI CHANGE:
  #   1. Download the "billing-visual-artifacts" artifact and inspect the
  #      *-diff.png / *-actual.png images - confirm every changed pixel is
  #      intended.
  #   2. Locally run: bun run e2e:update:billing
  #   3. Commit the regenerated PNGs in the SAME PR as the UI change and list
  #      the moved baselines in the PR description.
  # Never loosen the thresholds to make a red baseline pass.
  billing-visual:
    name: Billing visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun + node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: BillingCalendar / BillingSheet baselines
        timeout-minutes: 10
        run: bun run e2e:visual:billing -- --trace=retain-on-failure
      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billing-visual-artifacts-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            e2e/__screenshots__/
          if-no-files-found: ignore
          retention-days: 14
